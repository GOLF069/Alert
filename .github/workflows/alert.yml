name: smart-alert

on:
  schedule:
    - cron: "*/5 * * * *"   # ทุก 5 นาที (GitHub อาจหน่วงได้ในช่วงโหลดสูง)
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: smart-alert
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: smart_alert/requirements.txt
      - run: pip install -r smart_alert/requirements.txt
      - name: Run
        working-directory: smart_alert
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          CAPITAL_API_KEY: ${{ secrets.CAPITAL_API_KEY }}
          CAPITAL_IDENTIFIER: ${{ secrets.CAPITAL_IDENTIFIER }}
          CAPITAL_PASSWORD: ${{ secrets.CAPITAL_PASSWORD }}
        run: python run.py
      - name: Commit data
        run: |
          git config user.name "smart-alert-bot"
          git config user.email "bot@users.noreply.github.com"
          git add docs/data.json smart_alert/state.json
          git diff --cached --quiet || (git commit -m "update data" && git pull --rebase -q && git push)
